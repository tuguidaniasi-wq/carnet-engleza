<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14322f">
<title>Vorbește engleză</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">V</span>
      <div>
        <div class="brand-name">Vorbește</div>
        <div class="brand-sub">engleză vorbită, zi de zi</div>
      </div>
    </div>
    <div class="chips">
      <span class="chip" id="chip-streak" title="Zile la rând">0 zile</span>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Navigare">
    <button data-view="azi" class="active"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18" /></svg><span>Azi</span></button>
    <button data-view="program"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Program</span></button>
    <button data-view="carduri"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M8 5V3h12v12h-2"/></svg><span>Carduri</span></button>
    <button data-view="pronuntie"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zM19 11a7 7 0 0 1-14 0M12 18v3"/></svg><span>Pronunție</span></button>
    <button data-view="progres"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Progres</span></button>
  </nav>
</div>

<div id="toast" class="toast" role="status"></div>

<script src="data/zi.js"></script>
<script src="data/calatorii.js"></script>
<script src="data/medical.js"></script>
<script src="data/pronuntie.js"></script>
<script src="app.js"></script>
</body>
</html>
